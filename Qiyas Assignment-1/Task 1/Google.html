<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="Google.css">
    <script src="https://kit.fontawesome.com/c6b16a5f47.js" crossorigin="anonymous"></script>
</head>
<body>

    <header>
        <div class="bookmark-bar">
            <a href="#">|</a>
            <a href="#"><i class="fa-regular fa-folder"></i></a>
            <a href="#">All Bookmarks</a>
            
        </div>

        <div class="top-right">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
            <span class="menu"><i class="fa-solid fa-grip"></i></span>
            <img src="Images/profile.jpg" alt="profile image">
        </div>
    </header>

    <main>
        <h1 class="logo">Google</h1>

        <div class="search-box">
            <span><i class="fa-solid fa-magnifying-glass"></i></span>
            <input type="text" placeholder="Search Google or type a URL">
            <div class="icons">
                <span><i class="fa-solid fa-microphone"></i></span>
                <span><i class="fa-solid fa-camera"></i></span>
                <a href="#">AI Mode</a>
            </div>
        </div>

    <div class="shortcuts">
    
    <div class="shortcut">
        <div class="shortcut-icon"><img src="Images/gpt.png" alt="chatgpt"></div>
        <p>ChatGPT</p>
    </div>

    <div class="shortcut">
        <div class="shortcut-icon">W</div>
        <p>Webmail Login</p>
    </div>

    <div class="shortcut">
        <div class="shortcut-icon"><img src="Images/git.png" alt="GitHub"></div>
        <p>GitHub</p>
    </div>

    <div class="shortcut">
        <div class="shortcut-icon"><img src="Images/youtube.png" alt="YouTube"></div>
        <p> YouTube</p>
    </div>

    <div class="shortcut">
        <div class="shortcut-icon"><img src="Images/Next.js.png" alt="Next App"></div>
        <p> Create Next App</p>
    </div>


    <div class="shortcut">
        <div class="shortcut-icon">V</div>
        <p>Verify Session</p>
    </div>
    <div class="shortcut">
        <div class="shortcut-icon">+</div>
        <p>Add Shortcut</p>
    </div>


</div>
    </main>

</body>
</html>
